# 便单日程 API：转给本机的 biandan-api（127.0.0.1:18730）。由 BiandanAPI/deploy.sh 安装，不要手改。
# ^~ 让 /biandan/api/ 不再走站点里 .html、.sh 等正则规则，也不回落到首页。
location ^~ /biandan/api/ {
    proxy_pass http://127.0.0.1:18730/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    # 推送整份快照，上限与服务端一致
    client_max_body_size 16m;
    # 服务没起来时返回 JSON，而不是站点的 50x.html（服务自己返回的 4xx/5xx 照原样转发）
    error_page 502 503 504 = @biandan_api_down;
}

location @biandan_api_down {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 "{\"ok\":false,\"error\":{\"code\":\"service_down\",\"message\":\"schedule service unavailable\"}}\n";
}
